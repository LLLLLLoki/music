<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>右手指法大全 练习六线谱</title>
<style>

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #e8e8e8;
    color: #111;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
  }
  body { padding: 16px 12px 120px; }
  .sheet {
    width: min(920px, 100%);
    margin: 0 auto 22px;
    background: #fff;
    color: #111;
    padding: 18px 36px 40px;
    box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.06);
    min-height: 520px;
  }
  .rule {
    height: 4px;
    border-top: 2.5px solid #111;
    border-bottom: 1px solid #111;
    margin: 0 0 18px;
    background: transparent;
  }
  .mast { margin: 0 0 14px; }
  .ttl {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .12em;
    line-height: 1.25;
    color: #111;
  }
  .switcher { margin: 0 0 22px; }
  .ranks, .nums {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .ranks { margin: 0 0 10px; }
  .ranks button, .nums button {
    appearance: none;
    font: inherit;
    cursor: pointer;
    border: 1px solid #ccc;
    background: #fff;
    color: #111;
    border-radius: 3px;
    padding: 5px 12px;
    font-size: 14px;
    line-height: 1.2;
  }
  .ranks button:hover, .nums button:hover { background: #f3f3f3; }
  .ranks button.on {
    background: #111;
    color: #fff;
    border-color: #111;
  }
  .nums button {
    min-width: 36px;
    padding: 5px 0;
    text-align: center;
  }
  .nums button.on {
    background: #111;
    color: #fff;
    border-color: #111;
  }
  .ex-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin: 0 0 10px;
  }
  .ex-title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }
  .ex-meta { font-size: 13px; color: #444; }
  .system { cursor: pointer; display: block; }
  .system svg { display: block; height: auto; }
  .hint { margin: 18px 0 0; font-size: 12px; color: #666; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #3e6a96;
    color: #fff;
    z-index: 40;
    box-shadow: 0 -1px 0 rgba(0,0,0,.12);
    padding: 0 0 env(safe-area-inset-bottom);
  }
  .progress {
    width: 100%;
    height: 4px;
    margin: 0;
    background: rgba(255,255,255,.18);
    cursor: pointer;
    position: relative;
    touch-action: none;
  }
  .progress .loop-band {
    position: absolute; top: 0; bottom: 0;
    background: rgba(214, 176, 74, .9);
    pointer-events: none;
  }
  .progress .fill {
    position: absolute; inset: 0 auto 0 0;
    background: rgba(255,255,255,.75);
  }
  .progress .knob {
    position: absolute; top: 50%;
    width: 8px; height: 8px;
    margin: -4px 0 0 -4px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.18);
  }
  .dock-inner {
    width: 100%;
    padding: 4px 16px 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    align-items: center;
    justify-content: space-between;
  }
  .transport {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px 4px;
    min-width: 0;
  }
  .icon-btn, .speed-btn, .loop-ui button {
    appearance: none;
    font: inherit;
    cursor: pointer;
    color: #fff;
  }
  .icon-btn {
    width: 36px; height: 36px;
    border: 0;
    background: transparent;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex: 0 0 auto;
  }
  .icon-btn:hover, .speed-btn:hover { background: rgba(255,255,255,.14); }
  .icon-btn.on { background: #5487c6; }
  .icon-btn svg { display: block; }
  .speed-wrap { position: relative; }
  .speed-btn {
    border: 0;
    background: transparent;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-width: 52px;
    justify-content: center;
  }
  .speed-btn.open { background: rgba(255,255,255,.14); }
  .speed-btn .caret {
    display: inline-block;
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: .9;
  }
  .clock {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: rgba(255,255,255,.95);
    letter-spacing: .03em;
    margin: 0 4px 0 8px;
    white-space: nowrap;
  }
  .pos-line {
    font-size: 12px;
    color: rgba(255,255,255,.82);
    white-space: nowrap;
    margin-left: 6px;
  }
  .loop-ui {
    display: flex;
    align-items: center;
    gap: 6px 8px;
    flex-wrap: wrap;
    font-size: 12px;
    color: #fff;
  }
  .loop-ui .field { display: flex; align-items: center; gap: 4px; }
  .dock input[type="number"] {
    width: 42px;
    padding: 3px 4px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.5);
    background: rgba(255,255,255,.12);
    color: #fff;
    border-radius: 3px;
    font: inherit;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .dock input[type="number"]:focus {
    background: #fff;
    color: #111;
    outline: none;
    border-color: #fff;
  }
  .loop-ui button {
    border: 1px solid rgba(255,255,255,.55);
    background: transparent;
    border-radius: 3px;
    padding: 3px 8px;
    font-size: 12px;
  }
  .loop-ui button:hover { background: rgba(255,255,255,.14); }
  .speed-pop {
    display: none;
    position: absolute;
    bottom: calc(100% + 12px);
    left: 50%;
    transform: translateX(-50%);
    width: 248px;
    background: #fff;
    color: #111;
    border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0,0,0,.2), 0 0 0 1px rgba(0,0,0,.06);
    padding: 14px 16px 12px;
    z-index: 60;
    color-scheme: light;
  }
  .speed-pop.open { display: block; }
  .speed-pop .lab {
    font-size: 15px;
    margin: 0 0 12px;
    font-weight: 500;
  }
  .speed-row { display: flex; align-items: center; gap: 8px; }
  .speed-pop .step {
    width: 28px; height: 28px;
    border: 0;
    background: #eeeeee;
    color: #333;
    border-radius: 4px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex: 0 0 auto;
    padding: 0;
  }
  .speed-pop .step:hover { background: #e2e2e2; }
  .speed-pop input[type="range"] {
    flex: 1;
    min-width: 0;
    accent-color: #7f9bbc;
    height: 22px;
  }
  .speed-pop .bpm-edit {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #444;
  }
  .speed-pop .bpm-edit input[type="number"] {
    width: 64px;
    background: #fff;
    color: #111;
    border: 1px solid #ccc;
    padding: 3px 6px;
    font-size: 13px;
  }
  .presets { display: flex; gap: 6px; margin-top: 10px; }
  .presets button {
    flex: 1;
    appearance: none;
    font: inherit;
    border: 1px solid #ddd;
    background: #f6f6f6;
    color: #111;
    border-radius: 4px;
    padding: 3px 0;
    font-size: 12px;
    cursor: pointer;
  }
  .presets button.on {
    background: #3e6a96;
    color: #fff;
    border-color: #3e6a96;
  }
  @media (max-width: 700px) {
    .sheet { padding: 14px 14px 24px; min-height: 0; }
    .ttl { font-size: 22px; letter-spacing: .08em; }
    .dock-inner { padding: 4px 10px 8px; gap: 6px 8px; }
    .pos-line { display: none; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .dock { display: none !important; }
    .sheet { box-shadow: none; margin: 0; width: auto; }
  }

</style>
</head>
<body>
<div class="sheet">
  <div class="rule"></div>
  <div class="mast">
    <h1 class="ttl">右手指法大全</h1>
  </div>
  <div class="switcher">
    <div class="ranks" id="ranks"></div>
    <div class="nums" id="nums"></div>
  </div>
  <div class="ex-head">
    <h2 class="ex-title" id="exTitle">黑铁-1</h2>
    <div class="ex-meta" id="exMeta"></div>
  </div>
  <div class="system" id="system"></div>
  <p class="hint">闷音练习，谱上的 X 表示闷音。默认只响节拍器。循环默认打开，切换条目会停在该条开头。</p>
</div>
<div class="dock">
  <div class="progress" id="progress" role="slider" aria-label="进度">
    <div class="loop-band" id="loopBand" hidden></div>
    <div class="fill" id="fill"></div>
    <div class="knob" id="knob"></div>
  </div>
  <div class="dock-inner">
    <div class="transport">
      <button type="button" class="icon-btn" id="btnStop" title="停止" aria-label="停止">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="3.8" y="5" width="2.6" height="14" rx="0.4"/><path d="M8.2 12 L19.6 5.2 L19.6 18.8 Z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnPlay" title="播放" aria-label="播放">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5.2 L19 12 L8 18.8 Z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnLoop" title="循环" aria-label="循环" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7.2 h8 V4.8 L21 8.2 16 11.6 V9.2 H8"/><path d="M16 16.8 H8 v2.4 L3 16.8 8 13.4 v2.4 h8"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnMetro" title="节拍器" aria-label="节拍器" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M8.2 20 L11 4.2 h2 L16.8 20 Z"/><path d="M7.2 20.2 h9.6"/><path d="M12 7.5 L16.8 15"/><circle cx="17.2" cy="15.6" r="1.45" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="speed-wrap">
        <button type="button" class="speed-btn" id="btnSpeed" title="速度" aria-haspopup="dialog" aria-expanded="false">
          <span id="speedVal">60</span><span class="caret"></span>
        </button>
        <div class="speed-pop" id="speedPop" role="dialog" aria-label="速度">
          <p class="lab" id="speedRead">速度: 60拍/分</p>
          <div class="speed-row">
            <button type="button" class="step" id="bpmDown" aria-label="减慢">−</button>
            <input id="bpmSlider" type="range" min="20" max="220" step="1" value="60">
            <button type="button" class="step" id="bpmUp" aria-label="加快">+</button>
          </div>
          <div class="bpm-edit">BPM <input id="bpmInput" type="number" min="20" max="220" value="60"></div>
          <div class="presets" id="presets">
            <button type="button" data-bpm="40">40</button>
            <button type="button" data-bpm="60" class="on">60</button>
            <button type="button" data-bpm="80">80</button>
            <button type="button" data-bpm="100">100</button>
          </div>
        </div>
      </div>
      <span class="clock" id="clock">00:00 / 00:00</span>
    </div>
    <div class="loop-ui">
      <label class="field">第 <input id="loopStart" class="bar-num" type="number" min="1" max="1" value="1"> 到 <input id="loopEnd" class="bar-num" type="number" min="1" max="1" value="1"> 小节</label>
      <button type="button" id="btnLoopStart" title="把当前小节设为循环起点">起点</button>
      <button type="button" id="btnLoopEnd" title="把当前小节设为循环终点">终点</button>
      <span class="pos-line" id="pos">第 1 小节</span>
    </div>
  </div>
</div>

      gaps.forEach((g) => {
        if (!merged.length || g[0] > merged[merged.length-1][1]) merged.push(g.slice());
        else merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], g[1]);
      });
      let x = lp;
      let out = "";
      merged.forEach(([a, b]) => {
        const xa = Math.max(x, Math.min(a, staffEnd));
        if (xa > x) out += `<line x1="${x}" x2="${xa}" y1="${y}" y2="${y}" stroke="${INK}" stroke-width="1.15"/>`;
        x = Math.max(x, b);
      });
      if (staffEnd > x) out += `<line x1="${x}" x2="${staffEnd}" y1="${y}" y2="${y}" stroke="${INK}" stroke-width="1.15"/>`;
      return out;
    }

    // yellow current-measure highlight (from above staff to below beams)
    inner += `<rect x="${lp}" y="${LINE0 - 14}" width="${bw}" height="${by + 20 - (LINE0 - 14)}" fill="#fff3a0"/>`;

    // left barline, right barline (end bar)
    inner += `<line x1="${lp}" x2="${lp}" y1="${y1}" y2="${y6}" stroke="${INK}" stroke-width="1.4"/>`;
    inner += `<line x1="${staffEnd}" x2="${staffEnd}" y1="${y1}" y2="${y6}" stroke="${INK}" stroke-width="1.4"/>`;
    inner += `<line x1="${staffEnd + 3.5}" x2="${staffEnd + 3.5}" y1="${y1}" y2="${y6}" stroke="${INK}" stroke-width="3.2"/>`;

    for (let s = 1; s <= 6; s++) inner += drawStaffSegs(s);

    const groups = beamGroupsMap();
    const beamedSet = new Set();
    groups.forEach((g) => g.forEach((i) => beamedSet.add(i)));

    evs.forEach((e, i) => {
      const x = xAt(e.t);
      const topS = Math.min(...e.s);
      const stemFrom = yString(topS) + 6;
      const flagged = e.d <= 0.5 + 1e-9 && !beamedSet.has(i);
      const is16 = e.d <= 0.26 + 1e-9;
      let stemTo = by;
      if (flagged) stemTo = yString(6) + 8;
      else if (beamedSet.has(i) && is16) stemTo = by + 6;
      inner += `<line x1="${x}" x2="${x}" y1="${stemFrom}" y2="${stemTo}" stroke="${INK}" stroke-width="1.25"/>`;
      if (flagged) {
        // compact hook matching the book (short stem + 8th-rest-like flag)
        const fy = stemTo;
        inner += `<path d="M ${x} ${fy} C ${x + 1.2} ${fy + 3.5}, ${x + 3.5} ${fy + 6.5}, ${x + 1} ${fy + 10} C ${x - 1.2} ${fy + 12.5}, ${x - 5} ${fy + 10.5}, ${x - 4.2} ${fy + 7.8}" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
      e.s.forEach((s) => {
        const y = yString(s);
        inner += `<rect x="${x - 8.5}" y="${y - 8}" width="17" height="16" rx="1" fill="#fff"/>`;
        inner += `<text x="${x}" y="${y + 5}" text-anchor="middle" fill="${INK}" font-size="15.5" font-weight="800" font-family="Arial, Helvetica, sans-serif">X</text>`;
      });
    });

    // slurs
    evs.forEach((e, i) => {
      if (e.slur !== "start") return;
      let j = i + 1;
      while (j < evs.length && evs[j].slur !== "stop") j++;
      if (j >= evs.length) return;
      const x1 = xAt(e.t) + 8;
      const x2 = xAt(evs[j].t) - 8;
      inner += slurPath(x1, x2, LINE0 - 10);
    });

    // beams
    groups.forEach((g) => {
      const x1 = xAt(evs[g[0]].t);
      const x2 = xAt(evs[g[g.length - 1]].t);
      inner += `<line x1="${x1}" x2="${x2}" y1="${by}" y2="${by}" stroke="${INK}" stroke-width="3.8" stroke-linecap="square"/>`;
      const st = secondaryStates(g);
      st.forEach((kind, gi) => {
        if (!kind) return;
        const i = g[gi];
        const xe = xAt(evs[i].t);
        const yb = by + 6;
        if (kind === "begin") {
          // drawn with continue/end as a single run below
        } else if (kind === "continue" || kind === "end") {
          // skip, handled at begin
        } else if (kind === "forward") {
          const xn = gi + 1 < g.length ? xAt(evs[g[gi + 1]].t) : xe + 16;
          const xh = xe + Math.max(10, Math.min(15, (xn - xe) * 0.40));
          inner += `<line x1="${xe}" x2="${xh}" y1="${yb}" y2="${yb}" stroke="${INK}" stroke-width="3.2" stroke-linecap="square"/>`;
        } else if (kind === "backward") {
          const xp = gi - 1 >= 0 ? xAt(evs[g[gi - 1]].t) : xe - 16;
          const xh = xe - Math.max(10, Math.min(15, (xe - xp) * 0.40));
          inner += `<line x1="${xh}" x2="${xe}" y1="${yb}" y2="${yb}" stroke="${INK}" stroke-width="3.2" stroke-linecap="square"/>`;
        }
      });
      // continuous 16th runs
      let gi = 0;
      while (gi < g.length) {
        if (st[gi] !== "begin") { gi++; continue; }
        let gj = gi + 1;
        while (gj < g.length && (st[gj] === "continue" || st[gj] === "end")) gj++;
        const xa = xAt(evs[g[gi]].t);
        const xb = xAt(evs[g[gj - 1]].t);
        inner += `<line x1="${xa}" x2="${xb}" y1="${by + 6}" y2="${by + 6}" stroke="${INK}" stroke-width="3.2" stroke-linecap="square"/>`;
        gi = gj;
      }
      // tuplet 3 under the beam
      if (evs[g[0]].tuplet) {
        const xa = x1, xb = x2;
        const ty = by + 20;
        const mid = (xa + xb) / 2;
        inner += `<path d="M ${xa} ${ty - 4} L ${xa} ${ty} L ${mid - 8} ${ty}" fill="none" stroke="${INK}" stroke-width="1.1"/>`;
        inner += `<path d="M ${mid + 8} ${ty} L ${xb} ${ty} L ${xb} ${ty - 4}" fill="none" stroke="${INK}" stroke-width="1.1"/>`;
        inner += `<text x="${mid}" y="${ty + 4}" text-anchor="middle" fill="${INK}" font-size="13" font-weight="700" font-family="Times New Roman, Times, serif">3</text>`;
      }
    });

    if (active) {
      const px = xAt(Math.min(currentBeat, beats - 1e-6));
      inner += `<line x1="${px}" x2="${px}" y1="${LINE0 - 14}" y2="${by + 8}" stroke="#2ec4d6" stroke-width="1.4"/>`;
    }

    return `<svg viewBox="0 0 ${w} ${SYS_H}" width="${w}" height="${SYS_H}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }

  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem(STORE) || "{}");
      if (p.bpm) bpm = clamp(Number(p.bpm), 20, 220);
      if (typeof p.metro === "boolean") metro = p.metro;
      if (typeof p.loopOn === "boolean") loopOn = p.loopOn;
      if (p.rank && RANKS.includes(p.rank)) rank = p.rank;
      if (p.index) index = Number(p.index);
    } catch {}
    const ex = currentEx();
    if (!ex || ex.rank !== rank) { rank = "黑铁"; index = 1; }
    const maxI = EXERCISES.filter((e) => e.rank === rank).length;
    if (index < 1 || index > maxI) index = 1;
  }
  function savePrefs() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ bpm, metro, loopOn, rank, index }));
    } catch {}
  }

  const ICON_PLAY = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5.2 L19 12 L8 18.8 Z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="3.6" height="14" rx="0.6"/><rect x="14.4" y="5" width="3.6" height="14" rx="0.6"/></svg>';

  const bpmInput = document.getElementById("bpmInput");
  const bpmSlider = document.getElementById("bpmSlider");
  const btnPlay = document.getElementById("btnPlay");
  const btnLoop = document.getElementById("btnLoop");
  const btnMetro = document.getElementById("btnMetro");
  const btnSpeed = document.getElementById("btnSpeed");
  const speedPop = document.getElementById("speedPop");
  const loopStartEl = document.getElementById("loopStart");
  const loopEndEl = document.getElementById("loopEnd");
  const loopBand = document.getElementById("loopBand");
  const sysEl = document.getElementById("system");

  function syncSpeedUI() {
    bpmInput.value = String(bpm);
    bpmSlider.value = String(bpm);
    document.getElementById("speedVal").textContent = String(bpm);
    document.getElementById("speedRead").textContent = "速度: " + bpm + "拍/分";
    document.querySelectorAll("#presets button").forEach((b) => {
      b.classList.toggle("on", Number(b.dataset.bpm) === bpm);
    });
  }
  function syncLoopInputs() {
    btnLoop.classList.toggle("on", loopOn);
    btnLoop.setAttribute("aria-pressed", loopOn ? "true" : "false");
    loopStartEl.value = "1";
    loopEndEl.value = "1";
    loopStartEl.max = "1";
    loopEndEl.max = "1";
  }
  function syncMetroUI() {
    btnMetro.classList.toggle("on", metro);
    btnMetro.setAttribute("aria-pressed", metro ? "true" : "false");
  }

  function renderSwitcher() {
    const ranksEl = document.getElementById("ranks");
    ranksEl.innerHTML = RANKS.map((r) =>
      `<button type="button" data-rank="${r}" class="${r === rank ? "on" : ""}">${r}</button>`
    ).join("");
    const count = EXERCISES.filter((e) => e.rank === rank).length;
    const numsEl = document.getElementById("nums");
    let html = "";
    for (let i = 1; i <= count; i++) {
      html += `<button type="button" data-index="${i}" class="${i === index ? "on" : ""}">${i}</button>`;
    }
    numsEl.innerHTML = html;
    const ex = currentEx();
    document.getElementById("exTitle").textContent = ex.id;
    document.getElementById("exMeta").textContent = ex.time[0] + "/" + ex.time[1] + " · " + ex.beats + " 拍";
  }

  function fmtTime(beats) {
    const sec = Math.max(0, beats) * 60 / bpm;
    const s = Math.floor(sec + 1e-9);
    const m = Math.floor(s / 60);
    return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function render() {
    const cap = Math.min(beat, totalBeats());
    const localBeat = cap;
    let posText = `第 1 小节 第 ${Math.min(measureBeats(), Math.floor(localBeat) + 1)} 拍`;
    if (loopOn) posText = `循环 1–1 · ` + posText;
    document.getElementById("pos").textContent = posText;
    document.getElementById("clock").textContent = fmtTime(cap) + " / " + fmtTime(totalBeats());

    const p = totalBeats() ? clamp(beat / totalBeats(), 0, 1) : 0;
    document.getElementById("fill").style.width = (p * 100) + "%";
    document.getElementById("knob").style.left = (p * 100) + "%";
    if (loopOn) {
      loopBand.hidden = false;
      loopBand.style.left = "0%";
      loopBand.style.width = "100%";
    } else {
      loopBand.hidden = true;
    }
    sysEl.innerHTML = systemSVG(beat);
    btnPlay.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    btnPlay.title = playing ? "暂停" : "播放";
    btnPlay.setAttribute("aria-label", playing ? "暂停" : "播放");
  }

  function ensureAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    }
    if (audio && audio.state === "suspended") audio.resume();
    return audio;
  }
  function beep(freq, dur, gain) {
    if (!audio) return;
    try {
      const osc = audio.createOscillator(), g = audio.createGain();
      osc.type = "square"; osc.frequency.value = freq;
      g.gain.setValueAtTime(gain, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      osc.connect(g); g.connect(audio.destination);
      osc.start(); osc.stop(audio.currentTime + dur);
    } catch {}
  }

  function tick(now) {
    if (!playingRef.v) return;
    let next = originBeat + ((now - t0) / 1000) * (bpm / 60);
    if (loopOn) {
      const a = loopStartBeat(), z = loopEndBeat(), len = z - a;
      if (len > 0 && next >= z) {
        next = a + ((next - a) % len);
        originBeat = next;
        t0 = now;
        lastClick = Math.floor(next + 1e-6) - 1;
      }
    } else if (next >= totalBeats()) {
      beat = totalBeats();
      stopPlay(false);
      render();
      return;
    }
    beat = next;
    const ib = Math.floor(next + 1e-6);
    if (metro && ib !== lastClick && ib < totalBeats()) {
      lastClick = ib;
      const accent = ib % measureBeats() === 0;
      beep(accent ? 1320 : 880, 0.05, accent ? 0.07 : 0.04);
    }
    render();
    raf = requestAnimationFrame(tick);
  }

  function play() {
    ensureAudio();
    if (loopOn) {
      if (beat < loopStartBeat() || beat >= loopEndBeat() - 1e-6) seek(loopStartBeat());
    } else if (beat >= totalBeats()) seek(0);
    playing = playingRef.v = true;
    originBeat = beat;
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
    render();
  }
  function pause() {
    playing = playingRef.v = false;
    if (raf) cancelAnimationFrame(raf);
    render();
  }
  function stopPlay(reset) {
    playing = playingRef.v = false;
    if (raf) cancelAnimationFrame(raf);
    if (reset) beat = loopOn ? loopStartBeat() : 0;
    lastClick = -1;
  }
  function seek(b) {
    beat = clamp(b, 0, totalBeats());
    originBeat = beat;
    t0 = performance.now();
    lastClick = Math.floor(beat + 1e-6) - 1;
    if (playing) { /* keep going */ }
    render();
  }
  function setBpm(n) {
    bpm = clamp(Math.round(Number(n) || 60), 20, 220);
    if (playing) { originBeat = beat; t0 = performance.now(); }
    syncSpeedUI();
    savePrefs();
    render();
  }
  function closeSpeed() {
    speedPop.classList.remove("open");
    btnSpeed.classList.remove("open");
    btnSpeed.setAttribute("aria-expanded", "false");
  }
  function toggleSpeed(e) {
    e && e.stopPropagation();
    const open = !speedPop.classList.contains("open");
    speedPop.classList.toggle("open", open);
    btnSpeed.classList.toggle("open", open);
    btnSpeed.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function applyLoop(opts) {
    if (typeof opts.on === "boolean") loopOn = opts.on;
    savePrefs();
    syncLoopInputs();
    if (loopOn && (beat < loopStartBeat() || beat >= loopEndBeat())) {
      seek(loopStartBeat());
    } else render();
  }

  function selectEx(r, i, keepPlaying) {
    const wasPlaying = playing;
    stopPlay(true);
    rank = r;
    index = i;
    loopOn = true;
    loopA = 1;
    loopB = 1;
    beat = 0;
    lastClick = -1;
    savePrefs();
    renderSwitcher();
    syncLoopInputs();
    render();
    if (keepPlaying && wasPlaying) play();
  }

  document.getElementById("ranks").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-rank]");
    if (!b) return;
    const r = b.dataset.rank;
    if (r === rank) return;
    selectEx(r, 1);
  });
  document.getElementById("nums").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-index]");
    if (!b) return;
    const i = Number(b.dataset.index);
    if (i === index) return;
    selectEx(rank, i);
  });

  sysEl.addEventListener("click", (e) => {
    const svg = sysEl.querySelector("svg");
    if (!svg) return;
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * sysWidth();
    const lp = leftPad();
    const t = clamp((x - lp - 18) / (barWidth() - 36), 0, 1) * measureBeats();
    seek(t);
  });

  loadPrefs();
  renderSwitcher();
  syncSpeedUI();
  syncLoopInputs();
  syncMetroUI();

  btnPlay.onclick = () => { playing ? pause() : play(); };
  document.getElementById("btnStop").onclick = () => { stopPlay(true); render(); };
  btnLoop.onclick = () => applyLoop({ on: !loopOn });
  btnMetro.onclick = () => { metro = !metro; syncMetroUI(); savePrefs(); };
  btnSpeed.onclick = toggleSpeed;
  document.addEventListener("click", (e) => {
    if (!speedPop.classList.contains("open")) return;
    if (!e.target.closest(".speed-wrap")) closeSpeed();
  });
  document.getElementById("bpmDown").onclick = () => setBpm(bpm - 1);
  document.getElementById("bpmUp").onclick = () => setBpm(bpm + 1);
  bpmSlider.oninput = () => setBpm(bpmSlider.value);
  bpmInput.onchange = () => setBpm(bpmInput.value);
  document.getElementById("presets").onclick = (e) => {
    const b = e.target.closest("button[data-bpm]");
    if (b) setBpm(b.dataset.bpm);
  };
  loopStartEl.onchange = () => { loopA = 1; loopStartEl.value = "1"; applyLoop({}); };
  loopEndEl.onchange = () => { loopB = 1; loopEndEl.value = "1"; applyLoop({}); };
  document.getElementById("btnLoopStart").onclick = () => applyLoop({ on: true, a: 1 });
  document.getElementById("btnLoopEnd").onclick = () => applyLoop({ on: true, b: 1 });

  const progress = document.getElementById("progress");
  function seekFromEvent(e) {
    const r = progress.getBoundingClientRect();
    const x = (e.clientX ?? (e.touches && e.touches[0].clientX) ?? 0);
    seek(clamp((x - r.left) / r.width, 0, 1) * totalBeats());
  }
  progress.addEventListener("pointerdown", (e) => { progress.setPointerCapture(e.pointerId); seekFromEvent(e); });
  progress.addEventListener("pointermove", (e) => { if (e.buttons) seekFromEvent(e); });

  document.addEventListener("keydown", (e) => {
    if (e.target && (e.target.tagName === "INPUT")) return;
    if (e.key === "Escape" && speedPop.classList.contains("open")) { closeSpeed(); return; }
    if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === "s" || e.key === "S" || e.key === "Escape") { stopPlay(true); render(); }
    else if (e.key === "ArrowLeft") { seek(0); }
    else if (e.key === "ArrowRight") { seek(0); }
    else if (e.key === "ArrowUp") {
      const list = EXERCISES.filter((x) => x.rank === rank);
      const i = Math.min(list.length, index + 1);
      if (i !== index) selectEx(rank, i);
    } else if (e.key === "ArrowDown") {
      const i = Math.max(1, index - 1);
      if (i !== index) selectEx(rank, i);
    }
  });

  if (loopOn && (beat < loopStartBeat() || beat >= loopEndBeat())) beat = loopStartBeat();
  render();
  window.__practice = {
    seek, selectEx, render, currentEx, stopPlay, play, pause,
    setBeat: (b) => seek(b),
    freezePlaying: (b) => {
      seek(b);
      playing = playingRef.v = true;
      if (raf) cancelAnimationFrame(raf);
      render();
    },
    state: () => ({ rank, index, beat, bpm, metro, loopOn, beats: measureBeats(), playing, id: currentEx().id })
  };
})();

</script>
</body>
</html>
