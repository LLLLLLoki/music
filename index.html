<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>吉他练习曲库</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #f3f3f1;
    color: #111;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
  }
  body { padding: 28px 18px 64px; }
  .wrap { width: min(920px, 100%); margin: 0 auto; }
  header { margin-bottom: 22px; }
  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .08em;
  }
  .sub { margin: 0; color: #555; font-size: 13px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center;
    margin: 18px 0 16px;
  }
  .search {
    flex: 1 1 220px;
    padding: 8px 12px;
    border: 1px solid #111;
    border-radius: 2px;
    background: #fff;
    font: inherit;
    font-size: 14px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    appearance: none;
    border: 1px solid #111;
    background: #fff;
    color: #111;
    border-radius: 2px;
    padding: 4px 10px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .tag.on { background: #111; color: #fff; }
  .count { margin: 0 0 14px; font-size: 13px; color: #555; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    padding: 16px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 168px;
  }
  .card h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .04em;
    line-height: 1.3;
  }
  .card .en { margin: 0; font-size: 13px; color: #444; }
  .meta { margin: 4px 0 0; font-size: 12px; color: #555; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip {
    font-size: 11px;
    border: 1px solid #ccc;
    padding: 1px 6px;
    color: #333;
  }
  .actions { margin-top: auto; padding-top: 12px; display: flex; gap: 8px; }
  .actions a {
    display: inline-block;
    text-decoration: none;
    border: 1px solid #111;
    padding: 5px 11px;
    font-size: 13px;
    color: #111;
    background: #fff;
    border-radius: 2px;
  }
  .actions a.primary { background: #111; color: #fff; }
  .empty { padding: 40px 10px; text-align: center; color: #666; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>吉他练习曲库</h1>
    <p class="sub">本地离线目录，点开即可练习。曲谱按文件夹归类，不会散落各处。</p>
  </header>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="搜索曲名、版本或标签" autocomplete="off">
    <div class="tags" id="tags"></div>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</div>
<script src="songs.js"></script>
<script>
(function () {
  const songs = Array.isArray(window.SONGS) ? window.SONGS.slice() : [];
  const qEl = document.getElementById("q");
  const tagsEl = document.getElementById("tags");
  const grid = document.getElementById("grid");
  const countEl = document.getElementById("count");
  let activeTag = "";

  const allTags = [];
  songs.forEach((s) => (s.tags || []).forEach((t) => {
    if (t && allTags.indexOf(t) < 0) allTags.push(t);
  }));

  function href(song, file) {
    if (!file) return "";
    const folder = (song.folder || "").replace(/\\/g, "/").replace(/\/$/, "");
    return folder ? folder + "/" + file : file;
  }

  function renderTags() {
    tagsEl.innerHTML = "";
    const make = (label, value) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tag" + (activeTag === value ? " on" : "");
      b.textContent = label;
      b.onclick = () => { activeTag = activeTag === value ? "" : value; draw(); };
      tagsEl.appendChild(b);
    };
    make("全部", "");
    allTags.forEach((t) => make(t, t));
  }

  function filtered() {
    const q = (qEl.value || "").trim().toLowerCase();
    return songs.filter((s) => {
      if (activeTag && !(s.tags || []).includes(activeTag)) return false;
      if (!q) return true;
      const blob = [s.title, s.subtitle, s.version, s.artist, s.time, (s.tags || []).join(" ")].join(" ").toLowerCase();
      return blob.indexOf(q) >= 0;
    });
  }

  function draw() {
    renderTags();
    const list = filtered();
    countEl.textContent = list.length ? ("共 " + list.length + " 首") : "";
    grid.innerHTML = "";
    if (!list.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.style.gridColumn = "1 / -1";
      d.textContent = songs.length ? "没有符合条件的曲目" : "曲库还是空的，做好练习谱后会登记到这里。";
      grid.appendChild(d);
      return;
    }
    list.forEach((s) => {
      const card = document.createElement("article");
      card.className = "card";
      const h = document.createElement("h2");
      h.textContent = s.title + (s.version ? "（" + s.version + "）" : "");
      card.appendChild(h);
      if (s.subtitle) {
        const en = document.createElement("p");
        en.className = "en";
        en.textContent = s.subtitle;
        card.appendChild(en);
      }
      const bits = [];
      if (s.artist) bits.push(s.artist);
      if (s.capo != null && s.capo !== "") bits.push("变调夹 " + s.capo + " 品");
      if (s.time) bits.push(s.time);
      if (bits.length) {
        const m = document.createElement("p");
        m.className = "meta";
        m.textContent = bits.join(" · ");
        card.appendChild(m);
      }
      if (s.tags && s.tags.length) {
        const row = document.createElement("div");
        row.className = "chiprow";
        s.tags.forEach((t) => {
          const c = document.createElement("span");
          c.className = "chip";
          c.textContent = t;
          row.appendChild(c);
        });
        card.appendChild(row);
      }
      const act = document.createElement("div");
      act.className = "actions";
      if (s.practice) {
        const a = document.createElement("a");
        a.className = "primary";
        a.href = href(s, s.practice);
        a.textContent = "打开练习";
        act.appendChild(a);
      }
      if (s.musicxml) {
        const a = document.createElement("a");
        a.href = href(s, s.musicxml);
        a.textContent = "MusicXML";
        a.download = s.musicxml;
        act.appendChild(a);
      }
      card.appendChild(act);
      grid.appendChild(card);
    });
  }

  qEl.addEventListener("input", draw);
  draw();
})();
</script>
</body>
</html>
